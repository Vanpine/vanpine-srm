# ==================== 本地开发兜底（仅 Nacos 不可用时生效） ====================
# 主配置在 Nacos：gsc-shared.yaml（共享）+ gsc-delivery.yaml（交付专属）
# 本文件只兜底连接类与安全配置；日志/Knife4j/监控由 Nacos gsc-shared.yaml 管理
# 注意：profile 文件优先级高于 Nacos import，本文件的 key 会覆盖 Nacos 同名配置

spring:
  output:
    ansi:
      enabled: always
  # ==================== 本地 MySQL ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  # ==================== 本地 Redis ====================
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ==================== 本地 RabbitMQ（交付域为消费者，含消费重试） ====================
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 10000
          multiplier: 3
          max-interval: 60000

# ==================== MyBatis-Plus ====================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== GSC 业务配置 ====================
gsc:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 7200
    refresh-expiration: 604800
  internal:
    secret: ${INTERNAL_SECRET}
  ai:
    service:
      url: ${AI_SERVICE_URL:http://localhost:8100}
      token: ${AI_SERVICE_TOKEN:}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  security:
    # /internal/** 服务间内部接口：网关 InternalBlockWebFilter 已挡外部访问（403），
    # 服务内放行让无用户 token 的 Feign 调用（定时任务/消息消费）通过
    permit-paths:
      - /internal/**
