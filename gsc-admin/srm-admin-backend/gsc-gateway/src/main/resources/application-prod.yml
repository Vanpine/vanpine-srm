# ==================== 生产环境配置（gsc-gateway） ====================
# 位置：gsc-gateway/src/main/resources/application-prod.yml
# 优先级：Nacos prod 配置 > 本地 application-prod.yml
# 作用：生产环境优先读取环境变量；未设置时使用默认值兜底，保证服务可启动

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "${GSC_CORS_ALLOWED_ORIGINS}"
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS
            allowed-headers: Authorization,Content-Type,X-Requested-With,X-Tenant-Id,X-Tenant-Code
            allow-credentials: true
            max-age: 3600

gsc:
  jwt:
    secret: "${JWT_SECRET}"
  limit:
    qps: ${GATEWAY_LIMIT_QPS}
