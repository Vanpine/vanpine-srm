# ==================== 本地开发兜底（仅 Nacos 不可用时生效） ====================
# 主配置在 Nacos：gsc-shared.yaml（共享）+ gsc-platform.yaml（平台专属）
# 本文件只兜底连接类与安全配置；日志/Knife4j/监控由 Nacos gsc-shared.yaml 管理
# 注意：profile 文件优先级高于 Nacos import，本文件的 key 会覆盖 Nacos 同名配置

spring:
  output:
    ansi:
      enabled: always
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 10000
          multiplier: 3
          max-interval: 60000

  mail:
    aliyun:
      access-key-id: ${ALIYUN_ACCESS_KEY_ID}
      access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET}
      account-name: srm@mail.greensmartplanet.cn
      from-alias: GLOBAL SCM

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

gsc:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 7200
    refresh-expiration: 604800
  internal:
    secret: ${INTERNAL_SECRET}
  oss:
    endpoint: ${OSS_ENDPOINT}
    bucket: ${OSS_BUCKET}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET}
    custom-domain: ${OSS_CUSTOM_DOMAIN}
  passport:
    client-id: ${PASSPORT_CLIENT_ID}
    client-secret: ${PASSPORT_CLIENT_SECRET}
    api-base: ${PASSPORT_API_BASE}
  law-firm:
    api-base: ${LAW_FIRM_API_BASE}
  ai:
    service:
      url: ${AI_SERVICE_URL}
  login-url: http://localhost:5173/login
  website-url: http://localhost:5174/join
  match:
    engine: ai
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  payment:
    api-base: https://api.adminpanel.corporate-advisory.cn
    payment-main-id: 2
    # 收款方付完后 POST 此地址；必须公网可达，localhost 打不进来
    notify-url: ${GSC_PAYMENT_NOTIFY_URL:https://api.admin.gsc.greensmartplanet.cn/api/pub/payment/callback}
  security:
    permit-paths:
      - /api/passport/**
      - POST /api/applications
      - /api/pub/payment/**
